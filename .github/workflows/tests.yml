name: Engine Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run engine tests
        run: node --test

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: dev

      - name: Run browser E2E tests
        run: npm run test:e2e
        working-directory: dev

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-report-${{ github.run_id }}
          path: |
            dev/.playwright/report/
            dev/.playwright/test-results/
          if-no-files-found: ignore
          retention-days: 7
