name: Engine Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Каждый push в main получает собственную группу; устаревшие проверки PR по-прежнему отменяются.
  group: tests-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static analysis quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install static analysis dependencies
        run: npm ci
        working-directory: dev

      - name: Run ESLint quality gate
        run: npm run lint
        working-directory: dev

      - name: Check annotated JavaScript contracts
        run: npm run test:typecheck
        working-directory: dev

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run engine tests
        run: node --test

  browser:
    name: Browser E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: dev

      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: dev

      - name: Run Chromium E2E tests
        if: matrix.browser == 'chromium'
        run: npm run test:e2e -- --project=chromium
        working-directory: dev

      - name: Run Firefox E2E tests with software WebGL
        if: matrix.browser == 'firefox'
        run: xvfb-run --auto-servernum npm run test:e2e -- --project=firefox --headed
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VN_E2E_FIREFOX_SOFTWARE_WEBGL: "1"
        working-directory: dev

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-report-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            dev/.playwright/report/
            dev/.playwright/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release-candidate:
    name: Release candidate package
    # Сборка идёт параллельно обычным тестам; Windows smoke нужен для каждого релизуемого состояния main.
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read
    with:
      tag: ci-${{ github.sha }}
      deploy_pages: false
      run_node_tests: false
      run_windows_smoke: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
