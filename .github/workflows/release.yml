# Проверяет релизный кандидат и только после этого выполняет разрешённую публикацию.
name: Build ZIP for Release

on:
  # Опубликованный релиз автоматически получает проверенные архивы и обновляет Pages.
  release:
    types: [published]

  # Ручной запуск безопасен по умолчанию и может использоваться только для проверки ZIP.
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия или имя тестовой сборки, например v0.1.0.2 или test-build"
        required: true
        type: string
      upload_to_release:
        description: "Загрузить архивы в GitHub Release (только для публикации)"
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: "Обновить демо на GitHub Pages (только для публикации)"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  # Разные версии не отменяют друг друга, а повторная проверка той же версии не прерывает текущую.
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify release candidate
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      deploy_pages: ${{ github.event_name == 'release' || inputs.deploy_pages == true }}
      run_node_tests: true
      run_windows_smoke: true

  publish:
    name: Publish verified release
    needs: candidate
    if: github.event_name == 'release' || inputs.upload_to_release == true || inputs.deploy_pages == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      # Публикации выполняются последовательно, чтобы более старый Pages artifact не перезаписал новый.
      group: release-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VERSION: ${{ needs.candidate.outputs.version }}

    steps:
      - name: Download verified ZIP artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-zips-${{ github.run_id }}
          path: .

      - name: Upload to release
        if: github.event_name == 'release' || inputs.upload_to_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            ${{ github.event.repository.name }}-${{ env.VERSION }}.zip
            ${{ github.event.repository.name }}-${{ env.VERSION }}.zip.sha256
            ${{ github.event.repository.name }}-latest.zip
            ${{ github.event.repository.name }}-latest.zip.sha256
            ${{ github.event.repository.name }}-${{ env.VERSION }}-update.zip
            ${{ github.event.repository.name }}-${{ env.VERSION }}-update.zip.sha256
            ${{ github.event.repository.name }}-latest-update.zip
            ${{ github.event.repository.name }}-latest-update.zip.sha256

      - name: Download verified Pages candidate
        if: github.event_name == 'release' || inputs.deploy_pages == true
        uses: actions/download-artifact@v7
        with:
          name: release-site-${{ github.run_id }}
          path: build/site

      - name: Setup Pages
        if: github.event_name == 'release' || inputs.deploy_pages == true
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'release' || inputs.deploy_pages == true
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || inputs.deploy_pages == true
        id: deployment
        uses: actions/deploy-pages@v5
