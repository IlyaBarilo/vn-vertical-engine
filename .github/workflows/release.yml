# Сборка zip архива для релиза GitHub
name: Build ZIP for Release

on:
  # Запускать после публикации релиза
  release:
    types: [published]
  
  # Ручной запуск из вкладки Actions
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия или имя тестовой сборки, например v0.1.0.2 или test-build"
        required: true
        type: string
      upload_to_release:
        description: "Загрузить архивы в GitHub Release (только для публикации)"
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: "Обновить демо на GitHub Pages (только для публикации)"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  # Нужно для загрузки файлов в релиз
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      APP_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js for tests
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Run engine tests
        run: node --test

      - name: Install release smoke dependencies
        run: npm ci
        working-directory: dev

      - name: Install Chromium for release smoke
        run: npx playwright install --with-deps chromium
        working-directory: dev

      - name: Detect version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.tag }}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
      - name: Prepare release folder
        run: |
          # VERSION уже подготовлена в Detect version

          mkdir -p "build/$APP_NAME"
          mkdir -p "build/$APP_NAME/assets"
          mkdir -p "build/$APP_NAME/assets/backgrounds"
          mkdir -p "build/$APP_NAME/assets/characters"
          mkdir -p "build/$APP_NAME/assets/audio"
          mkdir -p "build/$APP_NAME/assets/games"
          mkdir -p "build/$APP_NAME/assets/video"
          mkdir -p "build/$APP_NAME/lib"
          mkdir -p "build/$APP_NAME/engine"
          mkdir -p "build/$APP_NAME/tools"
          mkdir -p "build/$APP_NAME/docs"
          mkdir -p "build/$APP_NAME/docs/examples"
          mkdir -p "build/$APP_NAME/docs/specs"

          # Копируем основные файлы проекта
          [ -f index.html ] && cp index.html "build/$APP_NAME/"
          [ -f story-example.js ] && cp story-example.js "build/$APP_NAME/"
          [ -f README.md ] && cp README.md "build/$APP_NAME/"
          [ -f README-EN.md ] && cp README-EN.md "build/$APP_NAME/"
          [ -f LICENSE ] && cp LICENSE "build/$APP_NAME/"
          [ -f COMMERCIAL-USE.md ] && cp COMMERCIAL-USE.md "build/$APP_NAME/"
          [ -f NOTICE.md ] && cp NOTICE.md "build/$APP_NAME/"
          [ -f tools/game-tester.html ] && cp tools/game-tester.html "build/$APP_NAME/tools/"
          [ -f tools/media-focus-editor.html ] && cp tools/media-focus-editor.html "build/$APP_NAME/tools/"
          [ -f tools/convert-360-img-to-js.html ] && cp tools/convert-360-img-to-js.html "build/$APP_NAME/tools/"
          [ -f tools/panorama-cleaner.html ] && cp tools/panorama-cleaner.html "build/$APP_NAME/tools/"
          [ -f tools/scene360-editor.html ] && cp tools/scene360-editor.html "build/$APP_NAME/tools/"
          [ -f FIRST-STEPS.md ] && cp FIRST-STEPS.md "build/$APP_NAME/"
          [ -f FIRST-STEPS-EN.md ] && cp FIRST-STEPS-EN.md "build/$APP_NAME/"

          [ -f engine/engine.css ] && cp engine/engine.css "build/$APP_NAME/engine/"
          [ -f engine/engine.js ] && cp engine/engine.js "build/$APP_NAME/engine/"
          [ -f engine/game-protocol.js ] && cp engine/game-protocol.js "build/$APP_NAME/engine/"
          [ -f engine/story-loader.js ] && cp engine/story-loader.js "build/$APP_NAME/engine/"

          [ -f story-example.js ] && cp story-example.js "build/$APP_NAME/docs/examples/"
          [ -f docs/specs/spec-story.md ] && cp docs/specs/spec-story.md "build/$APP_NAME/docs/specs/"
          [ -f docs/specs/spec-game.md ] && cp docs/specs/spec-game.md "build/$APP_NAME/docs/specs/"
          [ -d docs/360 ] && cp -a docs/360 "build/$APP_NAME/docs/"
          [ -d docs/demo ] && cp -a docs/demo "build/$APP_NAME/docs/"
          [ -d docs/games ] && cp -a docs/games "build/$APP_NAME/docs/"
          [ -d docs/kiosk ] && cp -a docs/kiosk "build/$APP_NAME/docs/"
          [ -d docs/stat ] && cp -a docs/stat "build/$APP_NAME/docs/"
          [ -d docs/tools ] && cp -a docs/tools "build/$APP_NAME/docs/"

          [ -f lib/mermaid.min.js ] && cp lib/mermaid.min.js "build/$APP_NAME/lib/"
          [ -f lib/jsrsasign-all-min.js ] && cp lib/jsrsasign-all-min.js "build/$APP_NAME/lib/"
          [ -f lib/three.min.js ] && cp lib/three.min.js "build/$APP_NAME/lib/"
          # [ -f lib/mermaid-editor.html ] && cp lib/mermaid-editor.html "build/$APP_NAME/lib/"

          # Копируем разрешённые форматы ассетов, сохраняя вложенные каталоги.
          # Helper также останавливает сборку при небезопасном пути или коллизии имён.
          node dev/scripts/copy-release-assets.mjs \
            --source assets \
            --destination "build/$APP_NAME/assets"


          # Панорамы 360: копируем дерево каталогов целиком (сценарий ссылается на пути вида assets/360/B101/...).
          if [ -d assets/360 ]; then
            cp -a assets/360 "build/$APP_NAME/assets/"
          fi
      - name: Prepare site build
        shell: bash
        run: |
          mkdir -p build/site
          cp -r build/$APP_NAME/* build/site/

      - name: Inject version into engine/engine.js
        shell: bash
        run: |

          # Подставляем номер версии в engine/engine.js
          VERSION_SAFE=$(printf '%s' "$VERSION" | sed 's/[\/&]/\\&/g')

          for TARGET in \
            "build/$APP_NAME/engine/engine.js" \
            "build/site/engine/engine.js"
          do
            if [ -f "$TARGET" ]; then
              sed -i "0,/__VERSION__/s/__VERSION__/$VERSION_SAFE/" "$TARGET"
            fi
          done

      - name: Create ZIP archives
        run: |
          # VERSION уже подготовлена в Detect version

          cd build
          zip -r "../${APP_NAME}-${VERSION}.zip" "$APP_NAME"

          # Update-архив не содержит пользовательские assets и корневые файлы истории.
          # Справочный пример остаётся только в docs/examples, чтобы не перезаписать рабочий файл пользователя.
          cp -r "$APP_NAME" "${APP_NAME}-update"
          rm -rf "${APP_NAME}-update/assets"
          rm -f "${APP_NAME}-update/story.js"
          rm -f "${APP_NAME}-update/story-example.js"
          zip -r "../${APP_NAME}-${VERSION}-update.zip" "${APP_NAME}-update"
          cd ..

          cp "${APP_NAME}-${VERSION}.zip" "${APP_NAME}-latest.zip"
          cp "${APP_NAME}-${VERSION}-update.zip" "${APP_NAME}-latest-update.zip"

      - name: Verify ZIP archives
        shell: bash
        run: |
          # Проверяем целостность обоих архивов до публикации или выдачи пользователю.
          unzip -tq "${APP_NAME}-${VERSION}.zip"
          unzip -tq "${APP_NAME}-${VERSION}-update.zip"
          unzip -Z1 "${APP_NAME}-${VERSION}.zip" > build/full-zip-contents.txt
          unzip -Z1 "${APP_NAME}-${VERSION}-update.zip" > build/update-zip-contents.txt

          # Полный архив должен содержать пример, ассеты, runtime и все авторские инструменты.
          grep -Fxq "${APP_NAME}/story-example.js" build/full-zip-contents.txt
          grep -Fxq "${APP_NAME}/assets/" build/full-zip-contents.txt
          grep -Fxq "${APP_NAME}/engine/engine.js" build/full-zip-contents.txt
          grep -Fxq "${APP_NAME}/tools/panorama-cleaner.html" build/full-zip-contents.txt

          # Update-архив сохраняет runtime, документацию и инструменты, но не заменяет данные автора.
          grep -Fxq "${APP_NAME}-update/engine/engine.js" build/update-zip-contents.txt
          grep -Fxq "${APP_NAME}-update/docs/examples/story-example.js" build/update-zip-contents.txt
          grep -Fxq "${APP_NAME}-update/tools/panorama-cleaner.html" build/update-zip-contents.txt

          # Developer-файлы не должны попадать ни в один пользовательский ZIP.
          if grep -Eq "^${APP_NAME}/(dev/|tests/|node_modules/|playwright-report/|test-results/|package(-lock)?\\.json$|playwright\\.config\\.mjs$|docs/TESTING\\.md$)" build/full-zip-contents.txt; then
            echo "Полный архив содержит developer-файлы."
            exit 1
          fi
          if grep -Eq "^${APP_NAME}-update/(assets/|story\\.js$|story-example\\.js$|dev/|tests/|node_modules/|playwright-report/|test-results/|package(-lock)?\\.json$|playwright\\.config\\.mjs$|docs/TESTING\\.md$)" build/update-zip-contents.txt; then
            echo "Update-архив содержит пользовательские данные или developer-файлы."
            exit 1
          fi

      - name: Run unpacked release smoke test
        run: npm run test:release:smoke -- "../${APP_NAME}-${VERSION}.zip"
        working-directory: dev

      - name: Upload release smoke failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-report-${{ github.run_id }}
          path: dev/.playwright/release-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-zips-${{ github.run_id }}
          path: |
            ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.zip
            ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}-update.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload to release
        if: github.event_name == 'release' || inputs.upload_to_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            ${{ github.event.repository.name }}-${{ env.VERSION }}.zip
            ${{ github.event.repository.name }}-latest.zip
            ${{ github.event.repository.name }}-${{ env.VERSION }}-update.zip
            ${{ github.event.repository.name }}-latest-update.zip

      - name: Setup Pages
        if: github.event_name == 'release' || inputs.deploy_pages == true
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'release' || inputs.deploy_pages == true
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      - name: Debug build
        run: ls -R build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || inputs.deploy_pages == true
        id: deployment
        uses: actions/deploy-pages@v5
