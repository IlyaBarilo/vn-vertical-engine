<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VN Engine (Offline)</title>

  <link rel="stylesheet" href="engine/engine.css" />
</head>
<body>

  <div id="unsupportedBrowser" role="alert" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;align-items:center;justify-content:center;padding:32px;background:#111;color:#fff;font:20px/1.5 Arial,sans-serif;text-align:center;">
    Internet Explorer не поддерживается. Откройте проект в актуальном Microsoft Edge, Chrome или Firefox.
  </div>

  <!--
    Сцена:
    - bgLayer: фон на весь экран с object-fit: cover
    - charLayer: персонаж поверх фона
    - overlay: затемнение/переходы (по желанию)
    - ui: диалог/меню/кнопки
  -->
  <div id="app" class="app">

    <div id="statsPanel" class="statsPanel hidden" aria-label="Statistics">
      <div class="statsCard">
        <div class="statsHeader">
          <div class="statsTitle">Script Statistics</div>
          <div class="statsHeaderActions">
            <div class="statsViewTabs" role="tablist" aria-label="Statistics views">
              <button id="btnShowFullGraph" class="btn" type="button" title="Show full graph">📊 Full Graph</button>
              <button id="btnShowResourcesGraph" class="btn" type="button" title="Resources graph">📦 Resources graph</button>
              <button id="btnShowGames" class="btn" type="button" title="Show games">🎮 Games</button>
              <button id="btnShowText" class="btn" type="button" title="Show text statistics">📄 Text</button>
            </div>
            <button id="btnCloseStats" class="btn" type="button" aria-label="Close stats">✕</button>
          </div>
        </div>

        <!-- Полоса показывает фоновую полную проверку CSS-панорам и не зависит от выбранной вкладки статистики. -->
        <div id="statsLoadProgress" class="statsLoadProgress hidden" role="status" aria-live="polite">
          <div class="statsLoadProgressText">
            <span>Checking 360° panorama packages</span>
            <span id="statsLoadProgressLabel">0 / 0</span>
          </div>
          <progress id="statsLoadProgressBar" class="statsLoadProgressBar" value="0" max="1"></progress>
        </div>
        
        <!-- Добавляем контейнер для переключения между текстом и графиком -->
        <div class="statsViewContainer">
          <!-- Текстовое поле статистики -->
          <textarea id="statsBody" class="statsBody"></textarea>
          
          <!-- Область для отображения графика Mermaid (изначально скрыта) -->
          <div id="graphContainer" class="graphContainer hidden">
             <!-- Wrapper для panzoom -->
              <div id="panzoomWrapper" class="panzoom-wrapper">
                <div id="panzoomContent" class="panzoom-content">
                  <div id="mermaidWrapper" class="mermaid-wrapper">
                    <div id="mermaidGraph" class="mermaid"></div>
                  </div>
                </div>
              </div>
              
              <!-- Панель управления масштабом -->
              <div class="graph-zoom-controls">
                <span id="zoomLevel" class="graph-zoom-level">100%</span>
                <button id="zoomOutBtn" class="graph-zoom-btn" title="Zoom Out">−</button>
                <button id="zoomInBtn" class="graph-zoom-btn" title="Zoom In">+</button>
                <button id="zoomResetBtn" class="graph-zoom-btn graph-zoom-reset" title="Reset zoom">⟲</button>
              </div>
          </div>

          <!-- Каталог игр -->
          <div id="gamesContainer" class="gamesContainer hidden">
            <div id="gamesStatus" class="gamesStatus">Last launch: —</div>
            <div id="gamesGrid" class="gamesGrid"></div>
          </div>

        </div>
        
        <!-- Панель управления графиком (изначально скрыта) -->
        <div id="graphControls" class="graphControls hidden">
          <button id="btnCopyMermaid" class="btn" type="button">📋 Copy code</button>
          <!-- <a href="https://mermaid.live/" target="_blank" class="btn" style="text-decoration: none;">🔗 Mermaid Live</a> -->
          <button id="btnRefreshGraph" class="btn" type="button">🔄 Refresh</button>
        </div>
      </div>
    </div>

    <div id="settingsPanel" class="statsPanel hidden" aria-label="Информация о программе">
      <div class="statsCard settingsCard">
        <div class="statsHeader">
          <div class="statsTitle settingsTitle">Информация о программе</div>
          <div class="statsHeaderActions">
            <button id="btnCloseSettings" class="btn" type="button" aria-label="Закрыть информацию">✕</button>
          </div>
        </div>
        <div class="statsViewContainer">
          <textarea id="settingsBody" class="statsBody settingsBody" readonly></textarea>
        </div>
      </div>
    </div>

    <!-- Контейнер standalone-игры из вкладки "Игры" -->
    <div id="statsGameModal" class="gameModal hidden" aria-label="Game">
      <div id="statsGameFrameWrap" class="gameFrameWrap statsGameFrameWrap">
        <iframe id="statsGameFrame" class="gameFrame" title="Standalone mini game" src="about:blank" sandbox="allow-scripts" allow="autoplay; accelerometer 'none'; camera 'none'; clipboard-read 'none'; clipboard-write 'none'; display-capture 'none'; fullscreen 'none'; gamepad 'none'; geolocation 'none'; gyroscope 'none'; hid 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; serial 'none'; usb 'none'; xr-spatial-tracking 'none'" referrerpolicy="no-referrer"></iframe>
        <div class="gameControls">
          <button id="btnCloseStatsGame" class="btn" type="button">Close Game</button>
        </div>
      </div>
    </div>

    <div id="stage" class="stage">
      <div id="blurBgLayer" class="blur-bg-layer hidden">
        <img id="blurBgImage" class="blur-bg-image" alt="" draggable="false" />
        <video id="blurBgVideo" class="blur-bg-video hidden" muted playsinline preload="metadata"></video>
      </div>

      <div id="novelWindow" class="novel-window">
        <img id="bgLayer" class="bg" alt="" draggable="false" />
        <video id="bgVideoLayer" class="bg hidden" muted loop playsinline preload="auto"></video>
        <canvas id="bg360Layer" class="bg bg-360 hidden" aria-hidden="true"></canvas>
        <div id="bg360MarksLayer" class="bg360-marks hidden" aria-hidden="true"></div>
        <div id="bgScrollHint" class="bg-scroll-hint hidden" aria-hidden="true">Перемещайте фон</div>
        <div id="charFrame" class="char-frame hidden" aria-hidden="true">
          <img id="charLayer" class="char hidden" alt="" draggable="false" />
        </div>
        <div id="overlay" class="overlay hidden"></div>

        <div id="storyVideoOverlay" class="story-video-overlay hidden" aria-label="Story video">
          <video id="storyVideoLayer" class="story-video-media hidden" playsinline preload="auto"></video>
          <img id="storyVideoPoster" class="story-video-media hidden" alt="" draggable="false" />
          <div id="storyVideoFallbackText" class="story-video-fallback hidden">Video unavailable</div>
          <div id="storyVideoSkipHint" class="story-video-skip-hint hidden">Click to skip</div>
        </div>


        <div id="uiFrame" class="ui-frame">
          <!-- Верхняя панель -->
          <div class="topbar">
            <div class="topbar-left">

            </div>

            <div class="topbar-right">
              <!-- Mute -->
              <button id="btnMute" class="btn icon-btn" type="button" aria-label="Mute"><span class="btn-icon">🔊</span></button>

              <!-- Volume -->
              <input id="volume" class="slider" type="range" min="0" max="100" value="20" />

              <!-- НОВОЕ: статистика/настройки -->
              <button id="btnSettings" class="btn icon-btn" type="button" aria-label="Информация о программе"><span class="btn-icon">ℹ️</span></button>
              <button id="btnStats" class="btn icon-btn" type="button" aria-label="Stats"><span class="btn-icon">📊</span></button>

              <!-- Restart -->
              <button id="btnRestart" class="btn icon-btn" type="button"><span class="btn-icon">🔄</span></button>
            </div>
          </div>


          <!-- Диалоговое окно -->
          <div id="dialog" class="dialog" role="button" tabindex="0" aria-label="Next">
            <div id="nameBox" class="name hidden"></div>
            <div id="textBox" class="text"></div>
            <div class="hint">Click to continue</div>
          </div>

          <!-- Контейнер выбора -->
          <div id="choices" class="choices hidden" aria-label="Choices"></div>

          <!-- Контейнер мини-игры (iframe) -->
          <div id="gameModal" class="gameModal hidden" aria-label="Game">
            <div class="gameFrameWrap">
              <iframe id="gameFrame" class="gameFrame" title="Mini game" src="about:blank" sandbox="allow-scripts" allow="autoplay; accelerometer 'none'; camera 'none'; clipboard-read 'none'; clipboard-write 'none'; display-capture 'none'; fullscreen 'none'; gamepad 'none'; geolocation 'none'; gyroscope 'none'; hid 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; serial 'none'; usb 'none'; xr-spatial-tracking 'none'" referrerpolicy="no-referrer"></iframe>
              <div class="gameControls">
                <button id="btnCloseGame" class="btn" type="button">Close Game</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Просмотр фото с 360-меток: карточка по центру, затемнённый фон. -->
        <div id="bg360PhotoViewer" class="bg360-photo-viewer hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
          <div class="bg360-photo-viewer-backdrop" data-bg360-photo-dismiss="1"></div>
          <div class="bg360-photo-viewer-stage">
            <div class="bg360-photo-card">
              <div class="bg360-photo-media">
                <div id="bg360PhotoViewport" class="bg360-photo-slide-viewport">
                  <div id="bg360PhotoInner" class="bg360-photo-slide-inner">
                    <img id="bg360PhotoImg" alt="" draggable="false" decoding="async">
                  </div>
                </div>
                <button type="button" class="bg360-photo-viewer-close" data-bg360-photo-close="1" aria-label="Закрыть">×</button>
                <button type="button" class="bg360-photo-nav bg360-photo-nav-prev hidden" data-bg360-photo-prev="1" aria-label="Предыдущее фото">‹</button>
                <button type="button" class="bg360-photo-nav bg360-photo-nav-next hidden" data-bg360-photo-next="1" aria-label="Следующее фото">›</button>
              </div>
              <div id="bg360PhotoViewerCaption" class="bg360-photo-viewer-caption hidden"></div>
            </div>
          </div>
        </div>
        
      </div>
    </div>


    

    

  </div>

  <script>
    // Показывает понятный отказ в Internet Explorer до разбора современных скриптов, которые этот браузер выполнить не сможет.
    (function showInternetExplorerWarning() {
      if (!document.documentMode) return;
      var warning = document.getElementById("unsupportedBrowser");
      var application = document.getElementById("app");
      if (application) application.style.display = "none";
      if (warning) warning.style.display = "flex";
    })();
  </script>
  <script src="engine/story-sandbox-loader.js"></script>
  <script>
    (function() {
      "use strict";

      // Разбирает единый параметр Debug без учёта регистра и не влияет на работу движка при ошибке в URL.
      function createDebugCategoryChecker(search) {
        var categories = Object.create(null);

        try {
          var params = new URLSearchParams(search || "");
          params.forEach(function(value, key) {
            if (String(key || "").trim().toLowerCase() !== "debug") return;

            String(value || "").split(/[\s,;]+/).forEach(function(category) {
              var normalized = category.trim().toLowerCase();
              if (!normalized) return;
              if (normalized === "1" || normalized === "true") normalized = "all";
              categories[normalized] = true;
            });
          });
        } catch (error) {
          categories = Object.create(null);
        }

        // Проверяет только запрошенную категорию; неизвестные значения URL безопасно игнорируются.
        return function isDebugCategoryEnabled(category) {
          var normalized = String(category || "").trim().toLowerCase();
          return !!(normalized && (categories.all || categories[normalized]));
        };
      }

      window.VN_DEBUG_ENABLED = createDebugCategoryChecker(window.location && window.location.search);

      var STORY_SCRIPT = "story.js";
      var STORY_EXAMPLE_SCRIPT = "story-example.js";
      var STORY360_SCRIPT = "story360.js";
      var ENGINE_SCRIPTS = [
        { src: "engine/resource-path-policy.js" },
        { src: "engine/expression.js" },
        { src: "engine/story-loader.js" },
        { src: "license-key.js", optional: true },
        { src: "lib/jsrsasign-all-min.js" },
        { src: "lib/three.min.js", optional: true },
        { src: "engine/game-protocol.js" },
        { src: "engine/engine.js" }
      ];

      // Динамически подключает JavaScript-файл; отсутствие ожидаемого optional-файла не засоряет консоль.
      function loadScript(src, options) {
        options = options || {};

        return new Promise(function(resolve, reject) {
          var script = document.createElement("script");
          script.src = src;
          script.async = false;

          script.onload = function() {
            resolve({ src: src, loaded: true });
          };

          script.onerror = function() {
            if (options.optional) {
              resolve({ src: src, loaded: false });
              return;
            }

            reject(new Error("Не удалось загрузить " + src));
          };

          document.body.appendChild(script);
        });
      }

      // Возвращает доверенный sandbox-загрузчик и останавливает запуск, если runtime-файл потерян.
      function getStorySandboxLoader() {
        var loader = window.VNStorySandboxLoader;
        if (!loader || typeof loader.loadStoryText !== "function" || typeof loader.loadStory360 !== "function") {
          throw new Error("Не удалось загрузить engine/story-sandbox-loader.js");
        }
        return loader;
      }

      // Превращает статус sandbox в понятную bootstrap-ошибку, не раскрывая содержимое сценария.
      function createSandboxLoadError(result) {
        var source = result && result.source ? result.source : "пользовательский файл";
        var detail = result && result.message ? result.message : "Неизвестная ошибка sandbox-загрузчика.";
        return new Error("Не удалось принять данные из " + source + ": " + detail);
      }

      // Принимает обязательный сценарий только как строку и запоминает фактический источник для диагностики парсера.
      function applyStoryTextResult(result) {
        if (!result || result.status !== "loaded") throw createSandboxLoadError(result);
        window.STORY_TEXT = result.value;
        window.STORY_SCRIPT_SOURCE = result.source;
      }

      // Загружает пользовательский story.js в sandbox, а пример подключает только при отсутствии основного файла.
      function loadStoryScript() {
        var loader = getStorySandboxLoader();
        return loader.loadStoryText(STORY_SCRIPT).then(function(result) {
          if (result.status === "loaded") {
            applyStoryTextResult(result);
            return;
          }
          if (result.status !== "missing") throw createSandboxLoadError(result);

          console.warn("[Bootstrap] story.js не найден, используется story-example.js");
          return loader.loadStoryText(STORY_EXAMPLE_SCRIPT).then(function(exampleResult) {
            applyStoryTextResult(exampleResult);
          });
        });
      }

      // Загружает optional story360.js в отдельном sandbox; отсутствие карты не мешает обычным сценам.
      function loadStory360Script() {
        var loader = getStorySandboxLoader();
        return loader.loadStory360(STORY360_SCRIPT).then(function(result) {
          if (result.status === "missing") return;
          if (result.status !== "loaded") {
            console.warn("[Bootstrap] story360.js отключён:", createSandboxLoadError(result).message);
            return;
          }

          window.STORY360 = result.value;
          window.STORY360_SCRIPT_SOURCE = result.source;
        }).catch(function(error) {
          console.warn("[Bootstrap] story360.js отключён:", error && error.message ? error.message : error);
        });
      }

      // Подключает файлы движка строго по очереди, чтобы сохранить зависимости между скриптами.
      function loadScriptsInOrder(scripts) {
        return scripts.reduce(function(sequence, item) {
          return sequence.then(function() {
            return loadScript(item.src, { optional: item.optional });
          });
        }, Promise.resolve());
      }

      // Показывает понятную ошибку запуска, если не удалось загрузить сценарий или движок.
      function showBootstrapError(error) {
        var textBox = document.getElementById("textBox");
        var message = "Не удалось запустить новеллу. Проверьте наличие story.js или story-example.js.";

        console.error("[Bootstrap]", error);

        if (textBox) {
          textBox.textContent = message;
          return;
        }

        document.body.textContent = message;
      }

      loadStoryScript()
        .then(function() {
          return loadStory360Script();
        })
        .then(function() {
          return loadScriptsInOrder(ENGINE_SCRIPTS);
        })
        .catch(showBootstrapError);
    })();
  </script>
</body>
</html>
